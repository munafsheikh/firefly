name: Quality Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 02:00 Africa/Johannesburg (UTC+2) every Saturday.
    - cron: '0 0 * * 6'

permissions:
  contents: read

jobs:
  coverage:
    name: JaCoCo + SonarQube Coverage
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: |
            pom.xml
            mcp-embedded/pom.xml
            plugins/*/pom.xml

      - name: Make quality tools executable
        run: chmod +x ./mvnw ./scripts/quality.sh ./scripts/quality-report.py

      - name: Generate JaCoCo coverage for app and plugins
        run: ./scripts/quality.sh coverage

      - name: Publish coverage summary
        if: always()
        run: python3 ./scripts/quality-report.py coverage

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
            **/target/site/jacoco/**/*.html
          if-no-files-found: warn
          retention-days: 14

      - name: SonarQube scan with JaCoCo coverage
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Explain skipped SonarQube scan
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: |
          {
            echo '## SonarQube'
            echo
            echo 'JaCoCo coverage was generated, but the SonarQube upload was skipped.'
            echo 'Configure repository secret `SONAR_TOKEN` and repository variable `SONAR_HOST_URL` to enable the scan.'
          } >> "$GITHUB_STEP_SUMMARY"

  mutation:
    name: PIT Mutation Coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: |
            pom.xml
            mcp-embedded/pom.xml
            plugins/*/pom.xml

      - name: Make quality tools executable
        run: chmod +x ./mvnw ./scripts/quality.sh ./scripts/quality-report.py

      - name: Run PIT mutation coverage
        run: ./scripts/quality.sh mutation

      - name: Publish mutation summary
        if: always()
        run: python3 ./scripts/quality-report.py mutation

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-mutation-coverage
          path: '**/target/pit-reports/**'
          if-no-files-found: warn
          retention-days: 14
