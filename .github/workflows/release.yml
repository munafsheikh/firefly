      - name: Deploy to GitHub Packages
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/ado-plugin -B deploy -DskipTests
        env:
          FIREFLY_DOCKER_ARGS: -e GITHUB_TOKEN -e GITHUB_ACTOR
