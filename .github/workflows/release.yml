name: Release

on:
  push:
    tags:
      - 'v*'
      - 'ado-plugin-*'
      - 'actuator-plugin-*'
      - 'cli-plugin-*'
      - 'mcp-registry-plugin-*'
      - 'midnight-theme-plugin-*'
      - 'plantuml-plugin-*'
      - 'markdown-plugin-*'
      - 'webtui-plugin-*'
      - 'bash-runner-plugin-*'

jobs:
  release-app:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Maven credentials for GitHub Packages (read by the build container)
        run: |
          mkdir -p ~/.m2
          printf '%s' '<settings><servers><server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server></servers></settings>' > ~/.m2/settings.xml

      - name: Deploy to GitHub Packages
        run: ./scripts/mvn.sh -B deploy -DskipTests
        env:
          FIREFLY_DOCKER_ARGS: -e GITHUB_TOKEN -e GITHUB_ACTOR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-ado-plugin:
    if: startsWith(github.ref, 'refs/tags/ado-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/ado-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
