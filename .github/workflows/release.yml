name: Release

on:
  push:
    tags:
      - 'v*'
      - 'ado-plugin-*'
      - 'actuator-plugin-*'
      - 'cli-plugin-*'
      - 'mcp-registry-plugin-*'
      - 'midnight-theme-plugin-*'
      - 'plantuml-plugin-*'
      - 'markdown-plugin-*'
      - 'webtui-plugin-*'
      - 'bash-runner-plugin-*'

jobs:
  release-app:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Deploy to GitHub Packages
        run: ./mvnw -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-ado-plugin:
    if: startsWith(github.ref, 'refs/tags/ado-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/ado-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-actuator-plugin:
    if: startsWith(github.ref, 'refs/tags/actuator-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/actuator-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-cli-plugin:
    if: startsWith(github.ref, 'refs/tags/cli-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/cli-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mcp-registry-plugin:
    if: startsWith(github.ref, 'refs/tags/mcp-registry-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/mcp-registry-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-midnight-theme-plugin:
    if: startsWith(github.ref, 'refs/tags/midnight-theme-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/midnight-theme-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plantuml-plugin:
    if: startsWith(github.ref, 'refs/tags/plantuml-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/plantuml-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-markdown-plugin:
    if: startsWith(github.ref, 'refs/tags/markdown-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/markdown-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-webtui-plugin:
    if: startsWith(github.ref, 'refs/tags/webtui-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/webtui-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-bash-runner-plugin:
    if: startsWith(github.ref, 'refs/tags/bash-runner-plugin-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: plugins/bash-runner-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docker-app:
    # Core app image, no plugins baked in — mirrors `docker compose up app`.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/java/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/firefly:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/firefly:latest

  release-docker-all-plugins:
    # Self-contained image with every plugin baked in — mirrors the
    # `showcase` compose profile (docker compose --profile showcase).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build all plugins
        run: |
          cd plugins/cli-plugin && mvn clean package -B -V -DskipTests && cd ../..
          cd plugins/actuator-plugin && mvn clean package -B -V -DskipTests && cd ../..
          cd plugins/ado-plugin && mvn clean package -B -V -DskipTests && cd ../..
          cd plugins/mcp-registry-plugin && mvn clean package -B -V -DskipTests && cd ../..
          cd plugins/midnight-theme-plugin && mvn clean package -B -V -DskipTests && cd ../..
          cd plugins/plantuml-plugin && mvn clean package -B -V -DskipTests && cd ../..
          cd plugins/markdown-plugin && mvn clean package -B -V -DskipTests && cd ../..
          cd plugins/webtui-plugin && mvn clean package -B -V -DskipTests && cd ../..
          cd plugins/bash-runner-plugin && mvn clean package -B -V -DskipTests && cd ../..

      - name: Flatten plugin jars into build context
        run: |
          cp plugins/cli-plugin/target/cli-plugin-*.jar plugins/
          cp plugins/actuator-plugin/target/actuator-plugin-*.jar plugins/
          cp plugins/ado-plugin/target/ado-plugin-*.jar plugins/
          cp plugins/mcp-registry-plugin/target/mcp-registry-plugin-*.jar plugins/
          cp plugins/midnight-theme-plugin/target/midnight-theme-plugin-*.jar plugins/
          cp plugins/plantuml-plugin/target/plantuml-plugin-*.jar plugins/
          cp plugins/markdown-plugin/target/markdown-plugin-*.jar plugins/
          cp plugins/webtui-plugin/target/webtui-plugin-*.jar plugins/
          cp plugins/bash-runner-plugin/target/bash-runner-plugin-*.jar plugins/
          ls -la plugins/*.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all-plugins image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/java/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/firefly-all-plugins:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/firefly-all-plugins:latest
