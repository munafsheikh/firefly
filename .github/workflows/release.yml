          FIREFLY_DOCKER_ARGS: -e GITHUB_TOKEN -e GITHUB_ACTOR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docker-app:
    # Core app image, no plugins baked in — mirrors `docker compose up app`.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/java/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/firefly:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/firefly:latest

  release-docker-all-plugins:
    # Self-contained image with every plugin baked in — mirrors the
    # `showcase` compose profile (docker compose --profile showcase).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Build all plugins
        run: |
          ./scripts/mvn.sh -C plugins/cli-plugin clean package -B -V -DskipTests
          ./scripts/mvn.sh -C plugins/actuator-plugin clean package -B -V -DskipTests
          ./scripts/mvn.sh -C plugins/ado-plugin clean package -B -V -DskipTests
          ./scripts/mvn.sh -C plugins/mcp-registry-plugin clean package -B -V -DskipTests
          ./scripts/mvn.sh -C plugins/midnight-theme-plugin clean package -B -V -DskipTests
          ./scripts/mvn.sh -C plugins/plantuml-plugin clean package -B -V -DskipTests
          ./scripts/mvn.sh -C plugins/markdown-plugin clean package -B -V -DskipTests
          ./scripts/mvn.sh -C plugins/webtui-plugin clean package -B -V -DskipTests
          ./scripts/mvn.sh -C plugins/bash-runner-plugin clean package -B -V -DskipTests

      - name: Flatten plugin jars into build context
        run: |
          cp plugins/cli-plugin/target/cli-plugin-*.jar plugins/
          cp plugins/actuator-plugin/target/actuator-plugin-*.jar plugins/
          cp plugins/ado-plugin/target/ado-plugin-*.jar plugins/
          cp plugins/mcp-registry-plugin/target/mcp-registry-plugin-*.jar plugins/
          cp plugins/midnight-theme-plugin/target/midnight-theme-plugin-*.jar plugins/
          cp plugins/plantuml-plugin/target/plantuml-plugin-*.jar plugins/
          cp plugins/markdown-plugin/target/markdown-plugin-*.jar plugins/
          cp plugins/webtui-plugin/target/webtui-plugin-*.jar plugins/
          cp plugins/bash-runner-plugin/target/bash-runner-plugin-*.jar plugins/
          ls -la plugins/*.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all-plugins image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/java/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/firefly-all-plugins:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/firefly-all-plugins:latest
