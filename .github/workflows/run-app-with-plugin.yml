name: Run App with Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  run-with-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build App
        run: ./scripts/mvn.sh clean package -DskipTests -B -V

      - name: Build CLI Plugin
        working-directory: plugins/cli-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/cli-plugin clean package -B -V

      - name: Build Actuator Plugin
        working-directory: plugins/actuator-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/actuator-plugin clean package -B -V

      - name: Build ADO Plugin
        working-directory: plugins/ado-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/ado-plugin clean package -B -V

      - name: Build MCP Registry Plugin
        working-directory: plugins/mcp-registry-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/mcp-registry-plugin clean package -B -V

      - name: Build Midnight Theme Plugin
        working-directory: plugins/midnight-theme-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/midnight-theme-plugin clean package -B -V

      - name: Build PlantUML Plugin
        working-directory: plugins/plantuml-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/plantuml-plugin clean package -B -V

      - name: Build Markdown Plugin
        working-directory: plugins/markdown-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/markdown-plugin clean package -B -V

      - name: Build WebTUI Browser Plugin
        working-directory: plugins/webtui-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/webtui-plugin clean package -B -V

      - name: Build Bash Runner Plugin
        working-directory: plugins/bash-runner-plugin
        run: $GITHUB_WORKSPACE/scripts/mvn.sh -C plugins/bash-runner-plugin clean package -B -V

      - name: Install Plugins
        run: |
          mkdir -p plugins
          cp plugins/cli-plugin/target/cli-plugin-*.jar plugins/
          cp plugins/actuator-plugin/target/actuator-plugin-*.jar plugins/
          cp plugins/ado-plugin/target/ado-plugin-*.jar plugins/
          cp plugins/mcp-registry-plugin/target/mcp-registry-plugin-*.jar plugins/
          cp plugins/midnight-theme-plugin/target/midnight-theme-plugin-*.jar plugins/
          cp plugins/plantuml-plugin/target/plantuml-plugin-*.jar plugins/
          cp plugins/markdown-plugin/target/markdown-plugin-*.jar plugins/
          cp plugins/webtui-plugin/target/webtui-plugin-*.jar plugins/
          cp plugins/bash-runner-plugin/target/bash-runner-plugin-*.jar plugins/
          ls -la plugins/

      - name: Create Bash Runner smoke script
        run: |
          mkdir -p "$HOME/.firefly/scripts"
          cat > "$HOME/.firefly/scripts/ci-smoke.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'argument=%s\n' "$1"
          printf 'FIREFLY_OPEN=https://example.com/firefly-ci\n'
          SCRIPT

      - name: Start Firefly with Plugin
        env:
          LOADER_PATH: plugins
          SPRING_DOCKER_COMPOSE_ENABLED: false
        run: |
          scripts/run-app.sh start --plugins

      - name: Wait for app to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:17922/ | grep -q 'Firefly Dashboard'; then
              echo "✅ App is up and dashboard is reachable"
              exit 0
            fi
            sleep 1
          done
          echo "❌ App failed to start"
          scripts/run-app.sh logs || true
          exit 1

      - name: Verify Actuator Plugin
        run: |
          curl -sf http://localhost:17922/actuator/health | grep -q '"status":"UP"' && echo '✅ Actuator Plugin loaded successfully'

      - name: Verify ADO Plugin
        run: |
          response=$(curl -sf http://localhost:17922/api/ado/health)
          echo "Plugin health response: $response"
          echo "$response" | grep -q '"plugin":"ado"' && echo '✅ ADO Plugin loaded successfully'

      - name: Verify MCP Registry Plugin
        run: |
          curl -sf http://localhost:17922/api/mcp-registry/mcps > /dev/null && echo '✅ MCP Registry Plugin loaded successfully'

      - name: Verify MCP Plugin Tree
        run: |
          curl -sf http://localhost:17922/api/mcp-registry/tree | grep -q '"pluginId":"mcp-registry"' && echo '✅ MCP plugin tree grouped skills/servers by plugin'

      - name: Verify Midnight Theme Plugin
        run: |
          curl -sf http://localhost:17922/api/theme | grep -q '"id":"midnight-theme"' && echo '✅ Midnight Theme Plugin discovered'

      - name: Verify PlantUML Plugin
        run: |
          curl -sf http://localhost:17922/api/plantuml/health | grep -q '"plugin":"plantuml"' && echo '✅ PlantUML Plugin loaded successfully'

      - name: Verify Markdown Plugin
        run: |
          curl -sf http://localhost:17922/api/markdown/health | grep -q '"plugin":"markdown"' && echo '✅ Markdown Plugin loaded successfully'

      - name: Verify WebTUI Browser Plugin
        run: |
          curl -sf http://localhost:17922/api/webtui/health | grep -q '"plugin":"webtui"' && echo '✅ WebTUI Browser Plugin loaded successfully (browserAvailable depends on host Chromium deps)'

      - name: Verify Bash Runner Plugin
        run: |
          curl -sf http://localhost:17922/api/bash-runner/health | grep -q '"plugin":"bash-runner"' && echo '✅ Bash Runner Plugin loaded successfully'
          curl -sf http://localhost:17922/api/mcp-registry/tree | grep -q '"pluginId":"bash-runner"' && echo '✅ Bash Runner MCP manifest discovered'
          response=$(curl -sf \
            -H 'Content-Type: application/json' \
            -d '{"script":"ci-smoke.sh","args":["hello world"],"open":false}' \
            http://localhost:17922/api/bash-runner/run)
          echo "Bash Runner response: $response"
          echo "$response" | grep -q '"exitCode":0' && echo '✅ Bash Runner waited for a successful script'
          echo "$response" | grep -q 'argument=hello world' && echo '✅ Bash Runner passed argv without shell interpolation'
          echo "$response" | grep -q '"openTarget":"https://example.com/firefly-ci"' && echo '✅ Bash Runner resolved FIREFLY_OPEN result'

      - name: Stop Firefly
        if: always()
        run: |
          scripts/run-app.sh stop
          sleep 2
