name: Local SLM Review Gates

# Two-stage code review for PRs touching Java.
# Each gate is opt-in through a repository Actions variable:
#   ENABLE_REVIEW_GATE_1=true
#   ENABLE_REVIEW_GATE_2=true
# The exact same Bash entrypoints are runnable locally through Maven.

on:
  pull_request:
    paths:
      - '**/*.java'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate-1:
    name: Review Gate 1 (Qwen 2.5 Coder 1.5B)
    if: ${{ vars.ENABLE_REVIEW_GATE_1 == 'true' }}
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    env:
      OLLAMA_HOST: http://localhost:11434
      REVIEW_GATE_1_MODEL: ${{ vars.REVIEW_GATE_1_MODEL || 'qwen2.5-coder:1.5b' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${OLLAMA_HOST}/api/tags" >/dev/null; then
              echo "Ollama is up."
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become healthy in time." >&2
          exit 1

      - name: Run Review Gate 1
        id: review1
        env:
          # GitHub-hosted runners are ephemeral, so Gate 1 may populate the
          # local Ollama service. Manual Maven runs default to offline/no-pull.
          REVIEW_GATE_ALLOW_PULL: 'true'
        run: |
          set +e
          bash tools/review-gate/review-gate-1.sh \
            --base "${{ github.base_ref }}" > review-output-1.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat review-output-1.txt

      - name: Post Gate 1 review as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          REVIEW_MODEL: ${{ env.REVIEW_GATE_1_MODEL }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('review-output-1.txt')
              ? fs.readFileSync('review-output-1.txt', 'utf8')
              : 'Review Gate 1 did not produce output.';
            const marker = '<!-- review-gate-1 -->';
            const commentBody = `${marker}\n### 🔍 Local SLM Review Gate 1 — ${process.env.REVIEW_MODEL}\n\n\`\`\`\n${body}\n\`\`\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Enforce Gate 1
        if: steps.review1.outputs.exit_code != '0'
        run: |
          echo "Review Gate 1 failed with exit code ${{ steps.review1.outputs.exit_code }} — see PR comment." >&2
          exit 1

  review-gate-2:
    name: Review Gate 2 (Qwen 3.6 27B)
    needs: review-gate-1
    # Gate 2 may run when Gate 1 is disabled, but never after Gate 1 fails.
    if: >-
      ${{
        always() &&
        vars.ENABLE_REVIEW_GATE_2 == 'true' &&
        (needs.review-gate-1.result == 'success' || needs.review-gate-1.result == 'skipped')
      }}
    runs-on: [self-hosted, linux, gpu]
    env:
      OLLAMA_HOST: http://localhost:11434
      REVIEW_GATE_2_MODEL: ${{ vars.REVIEW_GATE_2_MODEL || 'qwen3.6:27b' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run Review Gate 2
        id: review2
        run: |
          set +e
          bash tools/review-gate/review-gate-2.sh \
            --base "${{ github.base_ref }}" > review-output-2.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat review-output-2.txt

      - name: Post Gate 2 review as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          REVIEW_MODEL: ${{ env.REVIEW_GATE_2_MODEL }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('review-output-2.txt')
              ? fs.readFileSync('review-output-2.txt', 'utf8')
              : 'Review Gate 2 did not produce output.';
            const marker = '<!-- review-gate-2 -->';
            const commentBody = `${marker}\n### 🧠 Local SLM Review Gate 2 — ${process.env.REVIEW_MODEL}\n\n\`\`\`\n${body}\n\`\`\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Enforce Gate 2
        if: steps.review2.outputs.exit_code != '0'
        run: |
          echo "Review Gate 2 failed with exit code ${{ steps.review2.outputs.exit_code }} — see PR comment." >&2
          exit 1
