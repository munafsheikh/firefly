name: AI Review Gate

# Review of Java changes by ai-code-reviewers (rules + local model, no external API).
# Blocks merge on major+ findings; posts a PR comment; uploads SARIF.
#
# Runs a local small language model (Ollama + qwen2.5-coder:1.5b on the CPU runner) plus the
# platform's deterministic rules. Optional repository variables (Settings > Variables > Actions):
#   LLM_RUNTIME_IMAGE  model runtime image (default: pinned Ollama below)
#   LLM_MODEL          model runtime ref (default: qwen2.5-coder:1.5b)
#   LLM_PROFILE        platform profile (default: balanced; "offline" = rules only)

on:
  pull_request:
    paths:
      - '**/*.java'
      - .github/workflows/review-gate.yml

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: AI review
        id: acr
        uses: munafsheikh/ai-code-reviewers/integrations/github@3c6e9f9d1da9c7009ee108fc447324037d90b436 # main 2026-11-08
        with:
          profile: ${{ vars.LLM_PROFILE || 'balanced' }}
          paths: '*.java'
          runtime-image: ${{ vars.LLM_RUNTIME_IMAGE || 'ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8' }}
          pull-models: ${{ vars.LLM_MODEL || 'qwen2.5-coder:1.5b' }}
          model: ${{ vars.LLM_MODEL || 'qwen2.5-coder:1.5b' }}
          enforce: 'false'

      - name: Upload SARIF
        if: always() && hashFiles('acr-review/review.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: acr-review/review.sarif
          category: ai-review-gate

      - name: Enforce gate
        if: steps.acr.outputs.exit-code == '1'
        run: |
          echo "Blocked by AI review gate — see PR comment for details." >&2
          exit 1
