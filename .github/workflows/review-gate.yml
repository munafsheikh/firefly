name: Local SLM Review Gate

# First-pass code review on every PR touching Java, run entirely inside the
# runner (no external API calls, no cost). Blocks merge on BLOCK-severity
# findings; posts results as a PR comment either way.
#
# Runtime and model are repository variables (Settings > Variables > Actions):
#   LLM_RUNTIME_IMAGE  local model runtime container image (serves /api/* on 11434)
#   LLM_MODEL          review model id (small, CPU-friendly)
# The job is skipped until LLM_RUNTIME_IMAGE is set.

on:
  pull_request:
    paths:
      - '**/*.java'

# actions/github-script needs write access to list/create/update PR comments;
# the default GITHUB_TOKEN is read-only unless declared here.
permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs when new commits land on the same PR.
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    runs-on: ubuntu-latest
    if: ${{ vars.LLM_RUNTIME_IMAGE != '' }}
    services:
      llm-runtime:
        image: ${{ vars.LLM_RUNTIME_IMAGE }}
        ports:
          - 11434:11434
    env:
      LLM_HOST: ${LLM_BASE_URL}
      # Keep this ~1.5B params for a CPU-only runner; go bigger on a
      # self-hosted runner with more RAM/CPU or a GPU.
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Wait for model runtime
        run: |
          for i in $(seq 1 30); do
            if curl -sf ${LLM_BASE_URL} > /dev/null; then
              echo "Model runtime is up."
              exit 0
            fi
            sleep 2
          done
          echo "Model runtime did not become healthy in time." >&2
          exit 1

      - name: Pull review model
        run: |
          curl -sf ${LLM_BASE_URL} \
            -d "{\"name\": \"${LLM_MODEL}\"}"

      - name: Compute PR diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff "origin/${{ github.base_ref }}"...HEAD -- '*.java' > pr.diff
          echo "Diff lines: $(wc -l < pr.diff)"

      - name: Run ReviewGate
        id: review
        continue-on-error: true
        run: |
          java tools/review-gate/ReviewGate.java < pr.diff > review-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat review-output.txt

      - name: Post review as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-output.txt', 'utf8');
            const marker = '<!-- review-gate -->';
            const commentBody = `${marker}\n### 🔍 Local SLM Review Gate\n\n\`\`\`\n${body}\n\`\`\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Enforce gate
        if: steps.review.outputs.exit_code == '1'
        run: |
          echo "Blocked by ReviewGate — see PR comment for details." >&2
          exit 1
