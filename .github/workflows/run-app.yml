name: Run App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build App
        run: ./scripts/mvn.sh clean package -DskipTests -B -V

      - name: Start Firefly
        env:
          SPRING_DOCKER_COMPOSE_ENABLED: false
        run: |
          scripts/run-app.sh start

      - name: Wait for app to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:17922/ | grep -q 'Firefly Dashboard'; then
              echo "✅ App is up and dashboard is reachable"
              exit 0
            fi
            sleep 1
          done
          echo "❌ App failed to start"
          scripts/run-app.sh logs || true
          exit 1

      - name: Verify OpenAPI docs
        run: |
          curl -sf http://localhost:17922/v3/api-docs | grep -q "openapi" && echo "✅ OpenAPI docs available"

      - name: Stop Firefly
        if: always()
        run: |
          scripts/run-app.sh stop
          sleep 2
