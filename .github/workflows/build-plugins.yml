name: Build Plugins

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build CLI Plugin
        working-directory: plugins/cli-plugin
        run: mvn clean package -B -V

      - name: Build Actuator Plugin
        working-directory: plugins/actuator-plugin
        run: mvn clean package -B -V

      - name: Build ADO Plugin
        working-directory: plugins/ado-plugin
        run: mvn clean package -B -V

      - name: Build MCP Registry Plugin
        working-directory: plugins/mcp-registry-plugin
        run: mvn clean package -B -V

      - name: Build Midnight Theme Plugin
        working-directory: plugins/midnight-theme-plugin
        run: mvn clean package -B -V

      - name: Build PlantUML Plugin
        working-directory: plugins/plantuml-plugin
        run: mvn clean package -B -V

      - name: Build Markdown Plugin
        working-directory: plugins/markdown-plugin
        run: mvn clean package -B -V

      - name: Build WebTUI Browser Plugin
        working-directory: plugins/webtui-plugin
        run: mvn clean package -B -V

      - name: Build Bash Runner Plugin
        working-directory: plugins/bash-runner-plugin
        run: mvn clean package -B -V

      - name: Upload Plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            plugins/cli-plugin/target/cli-plugin-*.jar
            plugins/actuator-plugin/target/actuator-plugin-*.jar
            plugins/ado-plugin/target/ado-plugin-*.jar
            plugins/mcp-registry-plugin/target/mcp-registry-plugin-*.jar
            plugins/midnight-theme-plugin/target/midnight-theme-plugin-*.jar
            plugins/plantuml-plugin/target/plantuml-plugin-*.jar
            plugins/markdown-plugin/target/markdown-plugin-*.jar
            plugins/webtui-plugin/target/webtui-plugin-*.jar
            plugins/bash-runner-plugin/target/bash-runner-plugin-*.jar
          retention-days: 1
