<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefly Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #1e1e1e;
        }
        #terminal {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'monospace',
            theme: {
                background: '#1e1e1e',
                foreground: '#d4d4d4',
                cursor: '#d4d4d4',
                selectionBackground: '#264f78'
            },
            allowProposedApi: true
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host + '/ws/terminal';
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            term.writeln('\x1b[32mConnected to Firefly terminal\x1b[0m');
            sendResize();
        };

        socket.onmessage = (event) => {
            term.write(event.data);
        };

        socket.onclose = () => {
            term.writeln('\x1b[31mTerminal connection closed\x1b[0m');
        };

        socket.onerror = (err) => {
            term.writeln('\x1b[31mTerminal connection error\x1b[0m');
            console.error('WebSocket error:', err);
        };

        term.onData((data) => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(data);
            }
        });

        // Browsers move focus away from the terminal on Tab by default, which
        // means the keystroke never reaches xterm. Intercept it ourselves and
        // forward Tab / Shift+Tab as terminal input instead of letting it escape.
        term.attachCustomKeyEventHandler((event) => {
            if (event.key === 'Tab' && event.type === 'keydown') {
                event.preventDefault();
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(event.shiftKey ? '\x1b[Z' : '\t');
                }
                return false;
            }
            return true;
        });

        function sendResize() {
            if (socket.readyState === WebSocket.OPEN) {
                const dims = fitAddon.proposeDimensions();
                if (dims) {
                    socket.send('\x01' + dims.cols + ',' + dims.rows);
                }
            }
        }

        window.addEventListener('resize', () => {
            fitAddon.fit();
            sendResize();
        });

        // Initial resize after a short delay to ensure terminal is ready
        setTimeout(sendResize, 100);
    </script>
</body>
</html>
