<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation - Firefly</title>
    <style>
        :root {
            --firefly-bg: #f5f7fa;
            --firefly-surface: #ffffff;
            --firefly-text: #2d3748;
            --firefly-text-muted: #4a5568;
            --firefly-border: #e2e8f0;
            --firefly-accent: #667eea;
            --firefly-accent-2: #764ba2;
            --firefly-header-text: #ffffff;
            --firefly-link-list-bg: #edf2f7;
            --firefly-link-list-bg-hover: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--firefly-bg);
            color: var(--firefly-text);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, var(--firefly-accent) 0%, var(--firefly-accent-2) 100%);
            color: var(--firefly-header-text);
            padding: 1.5rem 2rem;
        }
        header h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
        header a.back { color: var(--firefly-header-text); opacity: 0.85; text-decoration: none; font-size: 0.9rem; }
        .layout {
            display: flex;
            align-items: flex-start;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            gap: 2rem;
        }
        nav.sidebar {
            flex: 0 0 260px;
            background: var(--firefly-surface);
            border: 1px solid var(--firefly-border);
            border-radius: 12px;
            padding: 1rem;
            position: sticky;
            top: 1rem;
        }
        nav.sidebar h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--firefly-text-muted);
            margin: 1rem 0 0.5rem;
        }
        nav.sidebar h3:first-child { margin-top: 0; }
        nav.sidebar ul { list-style: none; margin: 0; padding: 0; }
        nav.sidebar li { margin-bottom: 0.25rem; }
        nav.sidebar a {
            display: block;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            text-decoration: none;
            color: var(--firefly-text-muted);
            font-size: 0.9rem;
        }
        nav.sidebar a:hover { background: var(--firefly-link-list-bg-hover); }
        nav.sidebar a.active { background: var(--firefly-accent); color: var(--firefly-header-text); font-weight: 600; }
        main.content {
            flex: 1;
            min-width: 0;
            background: var(--firefly-surface);
            border: 1px solid var(--firefly-border);
            border-radius: 12px;
            padding: 2rem;
        }
        main.content img { max-width: 100%; border-radius: 8px; border: 1px solid var(--firefly-border); margin: 0.5rem 0; }
        main.content h1 { margin-top: 0; }
        main.content h1, main.content h2, main.content h3 { color: var(--firefly-text); }
        main.content table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.9rem; }
        main.content th, main.content td { border: 1px solid var(--firefly-border); padding: 0.5rem 0.75rem; text-align: left; }
        main.content th { background: var(--firefly-bg); }
        main.content code { background: var(--firefly-bg); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
        main.content pre { background: var(--firefly-bg); padding: 1rem; border-radius: 8px; overflow-x: auto; }
        main.content pre code { background: none; padding: 0; }
        main.content blockquote { border-left: 3px solid var(--firefly-accent); margin: 0.5rem 0; padding-left: 1rem; color: var(--firefly-text-muted); }
    </style>
    <link rel="stylesheet" href="/api/theme/active.css">
</head>
<body>
    <header>
        <a class="back" href="/">&larr; Dashboard</a>
        <h1>📚 Firefly Documentation</h1>
        <p style="margin:0;opacity:0.9;font-size:0.95rem;">Core features plus every installed plugin's own docs, in one place.</p>
    </header>
    <div class="layout">
        <nav class="sidebar">
            <h3>Core</h3>
            <ul>
                <li th:each="section : ${sections}" th:if="${section.category == 'Core'}">
                    <a th:href="@{/docs/{id}(id=${section.id})}"
                       th:text="${section.title}"
                       th:classappend="${section.id == activeSectionId} ? 'active' : ''">Section</a>
                </li>
            </ul>
            <h3>Plugins</h3>
            <ul>
                <li th:each="section : ${sections}" th:if="${section.category == 'Plugin'}">
                    <a th:href="@{/docs/{id}(id=${section.id})}"
                       th:text="${section.title}"
                       th:classappend="${section.id == activeSectionId} ? 'active' : ''">Section</a>
                </li>
                <li th:if="${#lists.isEmpty(sections.?[category == 'Plugin'])}" style="color:#a0aec0;font-size:0.85rem;padding:0.5rem 0.75rem;">
                    No plugins with docs installed yet.
                </li>
            </ul>
        </nav>
        <main class="content" th:utext="${contentHtml}">
            Documentation content
        </main>
    </div>
</body>
</html>
