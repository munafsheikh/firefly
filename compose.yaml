services:
  # ------------------------------------------------------------------
  # Default: Build and run the application
  # Usage: docker compose up app --build
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: .docker/java/Dockerfile
    ports:
      - "17922:17922"
    environment:
      - SERVER_PORT=17922
    volumes:
      - ./plugins:/app/plugins:ro

  # ------------------------------------------------------------------
  # Self-contained: All plugins baked into the image (no host mount)
  # Usage: docker compose --profile showcase up app-all-plugins showcase --build
  # Dashboard: http://localhost:17922
  # ------------------------------------------------------------------
  app-all-plugins:
    build:
      context: .
      dockerfile: .docker/java/Dockerfile
    ports:
      - "17922:17922"
    environment:
      - SERVER_PORT=17922

  # ------------------------------------------------------------------
  # Profile: showcase
  # Verifies all plugins work collectively and the dashboard loads
  # Usage: docker compose --profile showcase up app-all-plugins showcase --build
  # ------------------------------------------------------------------
  showcase:
    profiles: [showcase]
    image: curlimages/curl:latest
    depends_on:
      - app-all-plugins
    command: >
      sh -c "
        echo '' &&
        echo '========================================' &&
        echo '   🔥 Firefly Collective Showcase 🔥   ' &&
        echo '========================================' &&
        echo '' &&
        echo 'Waiting for services to be ready...' &&
        for i in $$(seq 1 60); do
          if curl -sf http://app-all-plugins:17922/ | grep -q 'Firefly Dashboard'; then
            echo '✅ Dashboard is reachable at http://localhost:17922/' &&
            break
          fi
          sleep 1
        done &&
        curl -sf http://app-all-plugins:17922/v3/api-docs | grep -q 'openapi' && echo '✅ Swagger / OpenAPI docs available at /swagger-ui.html' &&
        curl -sf http://app-all-plugins:17922/actuator/health | grep -q '\"status\":\"UP\"' && echo '✅ Actuator Plugin active (/actuator/health, /actuator/info, /actuator/metrics)' &&
        curl -sf http://app-all-plugins:17922/api/ado/health | grep -q '\"plugin\":\"ado\"' && echo '✅ ADO Plugin active (/api/ado/health)' &&
        curl -sf http://app-all-plugins:17922/ | grep -q 'Firefly CLI Plugin' && echo '✅ CLI Plugin detected on dashboard (Terminal ready)' &&
        echo '' &&
        echo '🌐 Open your browser to: http://localhost:17922/' &&
        echo '   - Dashboard with all plugins listed' &&
        echo '   - Terminal at /terminal' &&
        echo '   - Swagger UI at /swagger-ui.html' &&
        echo '   - Actuator at /actuator' &&
        echo '' &&
        echo '✨ All plugins working collectively!' &&
        echo '========================================'
      "
    restart: "no"

  # ------------------------------------------------------------------
  # Profile: build
  # Mirrors CI 'Build App' stage locally.
  # Usage: docker compose --profile build run --rm app-build
  # ------------------------------------------------------------------
  app-build:
    profiles: [build]
    image: maven:3-eclipse-temurin-25
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: ./mvnw clean install -B -V
    restart: "no"

  # ------------------------------------------------------------------
  # Profile: native
  # Builds a GraalVM native executable for the container's platform
  # (linux/amd64 or linux/arm64, matching the host running Docker).
  # The base image ships GraalVM + native-image but not a C toolchain,
  # so it's installed here before invoking the native-image build.
  # Usage: docker compose --profile native run --rm native-build
  # Output: target/firefly (native executable, run directly: ./target/firefly)
  # ------------------------------------------------------------------
  native-build:
    profiles: [native]
    image: ghcr.io/graalvm/native-image-community:25
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: >
      sh -c "
        microdnf install -y gcc glibc-devel zlib-devel libstdc++-static unzip findutils tar gzip &&
        ./mvnw -Pnative -DskipTests native:compile
      "
    restart: "no"

  # ------------------------------------------------------------------
  # Profile: build / plugin
  # Mirrors CI 'Build Plugins' stage locally.
  # Usage: docker compose --profile build run --rm plugin-build
  # ------------------------------------------------------------------
  plugin-build:
    profiles: [build, plugin]
    image: maven:3-eclipse-temurin-25
    working_dir: /app/plugins
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: >
      sh -c "
        cd /app/plugins/cli-plugin && mvn clean package -B -V &&
        cd /app/plugins/actuator-plugin && mvn clean package -B -V &&
        cd /app/plugins/ado-plugin && mvn clean package -B -V &&
        cd /app/plugins/mcp-registry-plugin && mvn clean package -B -V &&
        cp /app/plugins/cli-plugin/target/cli-plugin-*.jar /app/plugins/actuator-plugin/target/actuator-plugin-*.jar /app/plugins/ado-plugin/target/ado-plugin-*.jar /app/plugins/mcp-registry-plugin/target/mcp-registry-plugin-*.jar /app/plugins/
      "
    restart: "no"

  # ------------------------------------------------------------------
  # Profile: verify / test
  # Mirrors CI 'Run App' verification stage.
  # Usage: docker compose --profile verify up app verify
  # ------------------------------------------------------------------
  verify:
    profiles: [verify, test]
    image: curlimages/curl:latest
    depends_on:
      - app
    command: >
      sh -c "
        echo 'Waiting for app to be ready...' &&
        for i in $$(seq 1 60); do
          if curl -sf http://app:17922/ | grep -q 'Firefly Dashboard'; then
            echo '✅ App is up and dashboard is reachable'
            break
          fi
          sleep 1
        done &&
        curl -sf http://app:17922/v3/api-docs | grep -q 'openapi' && echo '✅ OpenAPI docs available'
      "
    restart: "no"

  # ------------------------------------------------------------------
  # Profile: plugin / verify
  # Mirrors CI 'Run App with Plugin' verification stage.
  # Usage: docker compose --profile plugin up app verify-plugin
  # ------------------------------------------------------------------
  verify-plugin:
    profiles: [plugin, verify]
    image: curlimages/curl:latest
    depends_on:
      - app
    command: >
      sh -c "
        echo 'Waiting for app with plugin to be ready...' &&
        for i in $$(seq 1 60); do
          if curl -sf http://app:17922/actuator/health | grep -q '\"status\":\"UP\"'; then
            echo '✅ App is up and healthy'
            break
          fi
          sleep 1
        done &&
        response=$$(curl -sf http://app:17922/api/ado/health) &&
        echo \"Plugin health: $$response\" &&
        echo \"$$response\" | grep -q '\"plugin\":\"ado\"' && echo '✅ ADO Plugin loaded successfully'
      "
    restart: "no"

volumes:
  maven-cache:
